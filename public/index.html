<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0A1F">
<title>Проверь себя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0A1F;--tx:#F4F2FF;--mut:rgba(244,242,255,.55);--glass:rgba(255,255,255,.065);--line:rgba(255,255,255,.11)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font:500 16px/1.4 Onest,system-ui,sans-serif;user-select:none;
padding:max(34px,calc(env(safe-area-inset-top,0px) + 20px)) 16px max(24px,calc(env(safe-area-inset-bottom,0px) + 16px));overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-2;width:440px;height:440px;border-radius:50%;filter:blur(95px)}
body::before{background:#5F45FF;top:-150px;left:-130px;opacity:.5;animation:driftO 9s ease-in-out infinite alternate}
body::after{background:#FF3D8B;bottom:-170px;right:-150px;opacity:.38;animation:driftO 11s ease-in-out infinite alternate-reverse}
@keyframes driftO{from{transform:translate(0,0)}to{transform:translate(36px,28px)}}

/* decorative layer: grid + floating objects */
.grid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
background-size:44px 44px;
-webkit-mask-image:radial-gradient(ellipse 95% 62% at 50% 0%,#000 0%,transparent 72%);
mask-image:radial-gradient(ellipse 95% 62% at 50% 0%,#000 0%,transparent 72%)}
.shapes{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.shapes i{position:absolute;display:block;opacity:.14;animation:drift var(--d) ease-in-out infinite alternate;will-change:transform}
@keyframes drift{from{transform:translateY(-16px) rotate(-6deg)}to{transform:translateY(18px) rotate(14deg)}}

main{max-width:480px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 4px 18px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.gear{all:unset;box-sizing:border-box;width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:19px;cursor:pointer;
background:var(--glass);border:1px solid var(--line);border-radius:16px;transition:transform .15s}
.gear:active{transform:scale(.9) rotate(-15deg)}
.glass{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--line);border-radius:28px;
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;
background:linear-gradient(115deg,rgba(255,255,255,.13) 0%,transparent 32%)}
.hero{display:flex;align-items:center;gap:18px;padding:20px;margin-bottom:12px;animation:cardIn .5s cubic-bezier(.2,.8,.2,1) backwards}
.hero p{margin:4px 0 0;color:var(--mut);font-size:14px}
.rw{position:relative;flex:none}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc b{font-size:34px;font-weight:800;line-height:1;white-space:nowrap}.rc span{font-size:12px;color:var(--mut)}
.ring{transform:rotate(-90deg);display:block}
.hero .ring{filter:drop-shadow(0 0 14px rgba(139,123,255,.35))}
.trk,.arc{fill:none;stroke-width:9}.trk{stroke:rgba(255,255,255,.09)}
.arc{stroke-linecap:round;stroke-dasharray:264;animation:fill 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes fill{from{stroke-dashoffset:264}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{all:unset;box-sizing:border-box;position:relative;overflow:hidden;cursor:pointer;padding:16px;min-height:150px;display:flex;flex-direction:column;
background:var(--glass);border:1px solid var(--line);border-radius:28px;transition:transform .15s;animation:cardIn .5s cubic-bezier(.2,.8,.2,1) backwards}
.card::before{content:"";position:absolute;width:130px;height:130px;right:-45px;top:-45px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));opacity:.35;filter:blur(26px)}
.card:active{transform:scale(.96)}.card:focus-visible{outline:2px solid var(--a)}
.card.wide{grid-column:span 2;min-height:130px}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,var(--a),var(--b));position:relative;
box-shadow:0 8px 24px -8px var(--a);animation:floatI 3.2s ease-in-out infinite alternate}
@keyframes floatI{from{transform:translateY(-2px) rotate(-3deg)}to{transform:translateY(3px) rotate(3deg)}}
.card .t{margin-top:12px;font-weight:700;color:var(--mut);font-size:14px}
.v{margin-top:auto;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.v small{font-size:13px;font-weight:600;color:var(--mut);margin-left:5px;letter-spacing:0}
.n{font-size:11px;color:var(--mut);margin-top:2px}
.pb{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin-top:10px;overflow:hidden}
.pb i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.badge{margin-top:18px;font-size:12px;color:#3CFFB0;font-weight:700;text-align:center;min-height:16px}
.pad{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;
height:74vh;height:72dvh;border-radius:40px;font-size:38px;font-weight:800;letter-spacing:-.02em;text-align:center;cursor:pointer;touch-action:manipulation;
color:#fff;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 20px 70px -10px var(--a);transition:filter .15s;position:relative;overflow:hidden}
.pad:active{filter:brightness(.92)}
.pad::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;transform:skewX(-22deg);
background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,55%{left:-70%}85%,100%{left:135%}}
.pad small{font-size:15px;font-weight:500;opacity:.8;letter-spacing:0}
.q{font-size:25px;font-weight:800;line-height:1.25;letter-spacing:-.01em;margin:14px 4px 20px;animation:cardIn .35s cubic-bezier(.2,.8,.2,1)}
.opt{all:unset;box-sizing:border-box;display:block;width:100%;padding:17px 18px;margin-bottom:10px;cursor:pointer;font-weight:700;
background:var(--glass);border:1px solid var(--line);border-radius:20px;transition:background .2s,transform .15s;animation:cardIn .3s cubic-bezier(.2,.8,.2,1) backwards}
.opt:active{transform:scale(.98)}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .3s}
.res{text-align:center;padding:32px 20px 28px;animation:cardIn .45s cubic-bezier(.2,.8,.2,1)}
.res.record{box-shadow:0 0 0 1px var(--a) inset,0 24px 70px -20px var(--a)}
.tag{display:inline-block;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:800;margin-bottom:14px;
background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 8px 24px -8px var(--a)}
.res .rw{width:fit-content;margin:0 auto 14px}.res .rc b{font-size:46px}
.res .ring{filter:drop-shadow(0 0 18px rgba(139,123,255,.3))}
.res p{color:var(--mut);margin:10px 0 0}
.btn{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;margin-top:12px;padding:16px;cursor:pointer;font-weight:800;
background:var(--glass);border:1px solid var(--line);border-radius:20px;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--tx);color:var(--bg);border-color:transparent}

/* confetti on new record */
.fx{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.fx b{position:absolute;top:42%;left:50%;width:8px;height:13px;border-radius:2px;opacity:0;
animation:burst var(--t) cubic-bezier(.15,.55,.4,1) forwards}
@keyframes burst{
 0%{opacity:1;transform:translate(-50%,-50%) rotate(0deg) translate(0,0)}
 100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) translate(var(--x),var(--y))}}

/* игра в память */
.mwrap{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:40px;color:#fff;
background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 20px 70px -10px var(--a)}
.mtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mtop b{font-size:20px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.mtop small{font-size:14px;font-weight:600;opacity:.85;text-align:right;min-width:0}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcell{all:unset;box-sizing:border-box;aspect-ratio:1;min-height:64px;border-radius:18px;background:rgba(255,255,255,.14);
border:1px solid rgba(255,255,255,.25);cursor:pointer;transition:background .15s,transform .15s;display:grid;place-items:center}
.mcell:active{transform:scale(.94)}
.mcell.on{background:rgba(255,255,255,.95);transform:scale(1.07)}
.mcell.ok{background:rgba(60,255,176,.7);border-color:transparent}
.mcell.bad{background:rgba(255,64,64,.75);border-color:transparent}
.mbar{height:6px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}
.mbar i{display:block;height:100%;background:rgba(255,255,255,.95);transition:width .4s}

/* кнопка завершения и выбор уровня/возраста IQ */
.exbtn{all:unset;box-sizing:border-box;position:fixed;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 14px));transform:translateX(-50%);
z-index:40;width:min(448px,calc(100% - 32px));padding:14px;cursor:pointer;font-weight:700;font-size:15px;text-align:center;color:#fff;
background:rgba(20,18,45,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;transition:transform .15s}
.exbtn:active{transform:translateX(-50%) scale(.97)}
#stage{padding-bottom:92px}

/* модальное окно подтверждения */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(6,5,20,.6);
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .2s}
.modal.show{opacity:1}
.mbox{width:100%;max-width:340px;padding:24px 20px;border-radius:28px;text-align:center;background:#171532;border:1px solid var(--line);
transform:scale(.92);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.modal.show .mbox{transform:scale(1)}
.mbox p{margin:0;font-size:20px;font-weight:800}
.mbox small{display:block;margin:8px 0 18px;color:var(--mut);font-size:13.5px}
.ilab{margin:16px 2px 8px;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;text-align:left}
.ichips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:2px}
.chip{all:unset;box-sizing:border-box;padding:9px 13px;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;
background:var(--glass);border:1px solid var(--line);transition:transform .15s,background .2s}
.chip:active{transform:scale(.94)}
.chip.sel{background:linear-gradient(135deg,#8B7BFF,#4FC3FF);color:#fff;border-color:transparent}
.opt.il{text-align:left;padding:14px 16px}
.opt.il b{display:block;font-size:17px}
.opt.il small{display:block;margin-top:3px;font-weight:600;color:var(--mut);font-size:12.5px}
.opt.il.sel{background:linear-gradient(135deg,rgba(139,123,255,.28),rgba(79,195,255,.28));border-color:#8B7BFF}
.mxgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px auto;max-width:280px}
.mxcell{aspect-ratio:1;border-radius:16px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.mxcell.q{font-size:28px;font-weight:800;color:var(--mut)}
.shopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.shopt{all:unset;box-sizing:border-box;aspect-ratio:1;border-radius:16px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;transition:transform .15s;animation:cardIn .3s cubic-bezier(.2,.8,.2,1) backwards}
.shopt:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="shapes" id="shapes"></div>
<main>
  <section id="home">
    <div class="top"><h1 id="hello">Привет!</h1><button class="gear" id="reset" aria-label="Сбросить прогресс">⚙️</button></div>
    <div id="list"></div>
    <div class="badge" id="badge"></div>
  </section>
  <section id="stage" hidden></section>
</main>

<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
try { tg.setHeaderColor('#0B0A1F'); tg.setBackgroundColor('#0B0A1F'); } catch {}
const $ = s => document.querySelector(s);
const haptic = (type, style) => { try { type === 'notify' ? tg.HapticFeedback?.notificationOccurred(style) : tg.HapticFeedback?.impactOccurred(style); } catch {} };

// плавающие декоративные объекты на фоне
(function(){
  const shapes = [
    { s:14, r:'50%',      c:'#8B7BFF', t:'6%',  l:'10%', d:'7s'  },
    { s:22, r:'0',        c:'#FF5C8A', t:'18%', l:'84%', d:'9s',  ring:1, br:'2px' },
    { s:16, r:'6px',      c:'#3CFFB0', t:'58%', l:'6%',  d:'8s',  rot:1 },
    { s:26, r:'50%',      c:'#4FC3FF', t:'74%', l:'88%', d:'10s', ring:1, br:'2px' },
    { s:10, r:'2px',      c:'#FF9A5C', t:'38%', l:'92%', d:'6s'  },
    { s:12, r:'50%',      c:'#FF3D8B', t:'88%', l:'16%', d:'8.5s' }
  ];
  $('#shapes').innerHTML = shapes.map(s =>
    `<i style="width:${s.s}px;height:${s.s}px;top:${s.t};left:${s.l};background:${s.ring ? 'transparent' : s.c};${s.ring ? `border:${s.br} solid ${s.c}` : ''};${s.rot ? 'transform:rotate(45deg);' : ''}border-radius:${s.r};--d:${s.d}"></i>`).join('');
})();

// initDataUnsafe — только для показа имени. Доверенная проверка идёт на сервере (/api/verify).
$('#hello').textContent = 'Привет, ' + (tg.initDataUnsafe?.user?.first_name || 'гость');

const cloud = tg.initData && tg.isVersionAtLeast?.('6.9') && tg.CloudStorage;
const parse = s => { try { return JSON.parse(s) || {}; } catch { return {}; } };
let best = {};
const load = cb => cloud ? tg.CloudStorage.getItem('best', (e, v) => cb(parse(v))) : cb(parse(localStorage.getItem('best')));
const save = () => { const s = JSON.stringify(best); cloud ? tg.CloudStorage.setItem('best', s) : (() => { try { localStorage.setItem('best', s); } catch {} })(); };
// поддержка старого формата данных (best[key] был просто числом)
const normalize = raw => { const out = {}; META.forEach(m => { const r = raw[m.key]; if (r == null) return;
  out[m.key] = (typeof r === 'object' && r.v != null) ? { v: r.v, n: r.n || 1 } : { v: r, n: 1 }; }); return out; };

const clamp = x => Math.max(0, Math.min(1, x));
const erf = x => { const a = Math.abs(x), t = 1 / (1 + 0.3275911 * a);
  const p = t * (0.254829592 + t * (-0.284496736 + t * (1.421413741 + t * (-1.453152027 + t * 1.061405429))));
  const y = 1 - p * Math.exp(-a * a);
  return x < 0 ? -y : y; };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const META = [
  { key:'reaction', title:'Реакция',        icon:'⚡', a:'#FF5C8A', b:'#FF9A5C', unit:'мс',    rule:'min', norm:v => (500 - v) / 350 },
  { key:'iq',       title:'IQ тест',        icon:'🧠', a:'#8B7BFF', b:'#4FC3FF', unit:'IQ',    rule:'max', norm:v => (v - 70) / 70 },
  { key:'logic',    title:'Логика',         icon:'🧩', a:'#FF6FD8', b:'#B24DFF', unit:'из 8',  rule:'max', norm:v => v / 8 },
  { key:'taps',     title:'Скорость тапов', icon:'👆', a:'#3CFFB0', b:'#3CB4FF', unit:'тап/с', rule:'max', norm:v => v / 10 },
  { key:'memory',   title:'Память',         icon:'🎴', a:'#FFD34D', b:'#FF7A3D', unit:'из 10', rule:'max', norm:v => v / 10 },
];

const ring = (p, a, b, size) => {
  const id = 'g' + Math.random().toString(36).slice(2);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 100 100"><defs><linearGradient id="${id}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>
  <circle class="trk" cx="50" cy="50" r="42"/><circle class="arc" cx="50" cy="50" r="42" stroke="url(#${id})" style="stroke-dashoffset:${264*(1-clamp(p))}"/></svg>`;
};
function countUp(el, to, dec = 0){
  const t0 = performance.now();
  (function f(t){ const k = clamp((t - t0) / 900), e = 1 - Math.pow(1 - k, 3);
    el.textContent = (to * e).toFixed(dec); if (k < 1) requestAnimationFrame(f); })(t0);
}
async function shareResult(text){
  try {
    await navigator.clipboard.writeText(text);
    haptic('notify', 'success');
    tg.showPopup ? tg.showPopup({ message: 'Скопировано! Вставь в любой чат.' }) : alert('Скопировано!');
  } catch {
    tg.showPopup ? tg.showPopup({ message: text }) : alert(text);
  }
}
// конфетти при новом рекорде; контейнер сам удаляется, клики не блокирует
function confetti(colors){
  const fx = document.createElement('div'); fx.className = 'fx';
  for (let i = 0; i < 28; i++){
    const b = document.createElement('b'), a = Math.random() * Math.PI * 2,
          d = 80 + Math.random() * 140;
    b.style.cssText = `background:${colors[i % colors.length]};--x:${Math.round(Math.cos(a) * d)}px;--y:${Math.round(Math.sin(a) * d + 40)}px;--r:${Math.round(Math.random() * 720 - 360)}deg;--t:${(0.9 + Math.random() * 0.6).toFixed(2)}s;animation-delay:${(Math.random() * 0.12).toFixed(2)}s`;
    fx.appendChild(b);
  }
  document.body.appendChild(fx);
  setTimeout(() => fx.remove(), 1900);
}

function askModal(title, note, onYes){
  haptic('impact', 'light');
  const ov = document.createElement('div');
  ov.className = 'modal';
  ov.innerHTML = `<div class="mbox"><p>${title}</p><small>${note}</small>
    <button class="btn main" id="myes">Да, завершить</button><button class="btn" id="mno">Продолжить</button></div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add('show'));
  const close = () => { ov.classList.remove('show'); setTimeout(() => ov.remove(), 200); };
  ov.querySelector('#myes').onclick = () => { close(); onYes(); };
  ov.querySelector('#mno').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };
}

function wireExit(g, direct){
  const b = document.getElementById('exit');
  if (!b) return;
  b.onclick = () => {
    if (g !== gen) return;
    if (direct) return show('home');
    askModal('Завершить тест?', 'Результат не будет сохранён', () => { gen++; show('home'); });
  };
}

function renderList(){
  const ns = META.filter(m => best[m.key] != null).map(m => clamp(m.norm(best[m.key].v)));
  const total = ns.length ? Math.round(ns.reduce((a, b) => a + b) / ns.length * 100) : 0;
  $('#list').innerHTML = `
    <div class="glass hero"><div class="rw">${ring(total/100, '#8B7BFF', '#FF5C8A', 118)}
      <div class="rc"><b>${ns.length ? total : '—'}</b><span>из 100</span></div></div>
      <div><h2>Общий рейтинг</h2><p>${ns.length === META.length ? 'Все тесты пройдены' : `Пройдено ${ns.length} из ${META.length}. Пройди все, чтобы получить полный рейтинг.`}</p></div></div>
    <div class="grid">${META.map((m, i) => { const r = best[m.key];
      return `<button class="card ${(m.key === 'reaction' || m.key === 'memory') ? 'wide' : ''}" data-k="${m.key}" style="--a:${m.a};--b:${m.b};animation-delay:${i*70}ms">
        <span class="ic">${m.icon}</span><span class="t">${m.title}</span>
        <span class="v">${r ? r.v : '—'}<small>${m.unit}</small></span>
        <span class="pb"><i style="width:${r == null ? 0 : Math.round(clamp(m.norm(r.v))*100)}%"></i></span>
        ${r ? `<span class="n">Попыток: ${r.n}</span>` : ''}</button>`; }).join('')}</div>`;
  document.querySelectorAll('.card').forEach(b => b.onclick = () => startTest(b.dataset.k));
}

load(v => { best = normalize(v); renderList(); });

// защита от «протухших» таймеров: любая навигация/старт теста увеличивает gen,
// и колбэки из предыдущего экрана просто ничего не делают
$('#reset').onclick = () => {
  const doReset = () => { best = {}; save(); renderList(); haptic('notify', 'success'); };
  askModal('Сбросить весь прогресс?', 'Это действие необратимо', doReset);
};

let gen = 0;
function startTest(k){
  const g = ++gen;
  haptic('impact', 'light');
  show('stage', g);
  TESTS[k](g);
}

function show(v, g){
  if (g !== undefined) gen = Math.max(gen, g);
  $('#home').hidden = v !== 'home'; $('#stage').hidden = v === 'home';
  v === 'home' ? tg.BackButton.hide() : tg.BackButton.show();
  if (v === 'home'){ renderList(); gen++; }
  scrollTo(0, 0);
}
tg.BackButton.onClick(() => show('home'));

const accent = m => `--a:${m.a};--b:${m.b}`;
function finish(key, value, verdict){
  if (typeof key === 'number') return; // страховка от вызова с устаревшим gen
  const m = META.find(x => x.key === key);
  const prev = best[key];
  const isRecord = !prev || (m.rule === 'max' ? value > prev.v : value < prev.v);
  best[key] = { v: isRecord ? value : prev.v, n: (prev?.n || 0) + 1 };
  save();
  haptic('notify', isRecord ? 'success' : 'warning');
  const shareText = `🏆 Мой результат в тесте «${m.title}»: ${value}${m.unit}. Попробуй побить!`;
  $('#stage').innerHTML = `<div class="glass res ${isRecord ? 'record' : ''}" style="${accent(m)}">
    ${isRecord ? '<span class="tag">🏆 Новый рекорд</span>' : ''}
    <div class="rw">${ring(m.norm(value), m.a, m.b, 190)}<div class="rc"><b id="cnt">0</b><span>${m.unit}</span></div></div>
    <h2>${verdict}</h2>
    <p>${isRecord ? 'Ты побил свой предыдущий рекорд' : 'Лучший результат: ' + best[key].v + ' ' + m.unit}</p>
    <p style="opacity:.6;font-size:12px;margin-top:6px">Попыток: ${best[key].n}</p></div>
    <button class="btn main" id="again">Ещё раз</button>
    <button class="btn" id="share">Поделиться результатом</button>
    <button class="btn" id="back">Назад</button>`;
  countUp($('#cnt'), value, key === 'taps' ? 1 : 0);
  if (isRecord) confetti([m.a, m.b, '#F4F2FF']);
  $('#again').onclick = () => startTest(key);
  $('#share').onclick = () => shareResult(shareText);
  $('#back').onclick = () => show('home');
}

const padStyle = k => accent(META.find(m => m.key === k));
const TESTS = {
  reaction(g){

  },
  iq(g){
    const SH = ['circle','square','triangle','star'];
    const COL = ['#8B7BFF','#FF5C8A','#3CFFB0','#FFD34D'];

      shape === 'triangle' ? `<polygon points="30,${30-r} ${30+r*.87},${30+r*.5} ${30-r*.87},${30+r*.5}"/>` :

    const same = (a, b) => a.shape === b.shape && a.color === b.color && a.rot === b.rot;

      const shapes = shuffle(SH).slice(0, 3), colors = shuffle(COL).slice(0, 3), rots = hard ? [0, 120, 240] : [0, 0, 0];

    const NUM = [

    const AGES = [

      { t:'13', v:13 }, { t:'14', v:14 }, { t:'15', v:15 },
      { t:'16–24', v:20 }, { t:'25–34', v:30 }, { t:'35–44', v:40 },

        <div class="ilab">Возраст</div>

      document.querySelectorAll('.chip').forEach(b => b.onclick = () => { if (g !== gen) return; ageIdx = +b.dataset.i; haptic('impact', 'light'); intro(); });

    const start = () => {

      let i = 0; const res = []; const SN = 4; let spd = { ok:0 };

        const age = AGES[ageIdx].v;

        const v = Math.max(55, Math.min(165, Math.round(raw)));
        const pct = Math.max(1, Math.min(99, Math.round((0.5 + 0.5 * erf((v - 100) / 15 / Math.SQRT2)) * 100)));
        const band = v >= 130 ? 'Очень высокий' : v >= 120 ? 'Высокий' : v >= 110 ? 'Выше среднего' : v >= 90 ? 'Средний' : v >= 80 ? 'Ниже среднего' : v >= 70 ? 'Пограничный' : 'Низкий';
        const extra = age <= 15 ? `Ментальный возраст ~${ma} лет.` : `Выше ${pct}% людей твоего возраста.`;

      };
      const askSpeed = si => {

        const rnd = () => ({ shape: SH[Math.floor(Math.random()*4)], color: COL[Math.floor(Math.random()*4)], rot: [0,90,180,270][Math.floor(Math.random()*4)] });
        const target = rnd(), opts = [target];

          <div class="mxgrid" style="grid-template-columns:1fr;max-width:110px"><div class="mxcell">${shapeSVG(target.shape,target.color,target.rot)}</div></div>
          <div class="shopts">${sh.map(o => `<button class="shopt">${shapeSVG(o.shape,o.color,o.rot)}</button>`).join('')}</div>

          $('#stage').innerHTML = `<div style="${padStyle('iq')}"><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><p class="q" style="font-size:18px">Какая фигура должна быть на месте «?»${it.hard ? ' (сложный уровень)' : ''}</p>

            <button class="exbtn" id="exit">Завершить</button></div>`;

            `<button class="exbtn" id="exit">Завершить</button></div>`;

          document.querySelectorAll('.opt').forEach(b => b.onclick = () => {

            if (!ok) b.style.background = 'linear-gradient(135deg,#FF5C8A,#FF9A5C)';
            setTimeout(() => { if (g !== gen) return; i++; ask(); }, 500);
          });
        }
      };
      ask();
    };
    intro();
  },

  logic(g){
    const POOL = [
      ['Что можно увидеть с закрытыми глазами?', ['Сон','Свет','Тьму','Ничего'], 'Сон'],
      ['У отца Марии пять дочерей: Хахаха, Хихихи, Хохохо, Хюхюхю и …?', ['Хахаха','Мария','Хыхыхы','Смехуля'], 'Мария'],

    const N = Math.min(8, POOL.length);

    let i = 0, correct = 0;

        Q[i].o.map((o, j) => `<button class="opt" style="animation-delay:${j * 40}ms" data-j="${j}">${o}</button>`).join('') +
        `<button class="exbtn" id="exit">Завершить</button></div>`;

        if (!ok) b.style.background = 'linear-gradient(135deg,#FF5C8A,#FF9A5C)';

  memory(g){
    const N = 12, TOTAL = 10, ON = 520, GAP = 160;
    let r = 1, seq = [], pos = 0, phase = 'wait';
    $('#stage').innerHTML = `<div class="mwrap" style="${padStyle('memory')}">
      <div class="mtop"><b>Раунд 1 из ${TOTAL}</b><small id="ms">Приготовься…</small></div>
      <div class="mgrid">${Array.from({length:N}, (_,i) => `<button class="mcell" data-i="${i}" aria-label="Карта ${i+1}"></button>`).join('')}</div>
      <div class="mbar"><i id="mp" style="width:0%"></i></div></div><button class="exbtn" id="exit">Завершить</button>`;
    wireExit(g);
    const stat = t => { const el = document.getElementById('ms'); if (el) el.textContent = t; };
    const prog = w => { const el = document.getElementById('mp'); if (el) el.style.width = w + '%'; };
    const play = () => {
      if (g !== gen) return;
      phase = 'flash'; pos = 0;
      document.querySelectorAll('.mcell').forEach(c => c.classList.remove('ok', 'bad'));
      stat('Запоминай…');
      seq = shuffle(Array.from({length:N}, (_,i) => i)).slice(0, r);
      seq.forEach((ci, k) => setTimeout(() => {

        if (!el) return;

      }, 400 + k * (ON + GAP)));

        phase = 'wait'; haptic('notify', 'error'); el.classList.add('bad');
        const done = r - 1;
        const verdict = done >= 7 ? 'Почти идеально!' : done >= 4 ? 'Хорошая память' : 'Есть куда расти';
        setTimeout(() => { if (g === gen) finish('memory', done, verdict); }, 650);
      }
    });
    setTimeout(() => { if (g === gen) play(); }, 500);
  }
};

fetch('/api/verify', { headers: { 'X-Init-Data': tg.initData || '' } })
  .then(r => r.json())
  .then(d => { $('#badge').textContent = d.ok ? '✓ Аккаунт Telegram подтверждён' : ''; })
  .catch(() => {});
</script>
