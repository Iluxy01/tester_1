<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0A1F">
<title>Проверь себя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0A1F;--tx:#F4F2FF;--mut:rgba(244,242,255,.55);--glass:rgba(255,255,255,.065);--line:rgba(255,255,255,.11)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font:500 16px/1.4 Onest,system-ui,sans-serif;user-select:none;
padding:max(34px,calc(env(safe-area-inset-top,0px) + 20px)) 16px max(24px,calc(env(safe-area-inset-bottom,0px) + 16px));overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-2;width:440px;height:440px;border-radius:50%;filter:blur(95px)}
body::before{background:#5F45FF;top:-150px;left:-130px;opacity:.5;animation:driftO 9s ease-in-out infinite alternate}
body::after{background:#FF3D8B;bottom:-170px;right:-150px;opacity:.38;animation:driftO 11s ease-in-out infinite alternate-reverse}
@keyframes driftO{from{transform:translate(0,0)}to{transform:translate(36px,28px)}}

/* decorative layer: grid + floating objects */
.grid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
background-size:44px 44px;
-webkit-mask-image:radial-gradient(ellipse 95% 62% at 50% 0%,#000 0%,transparent 72%);
mask-image:radial-gradient(ellipse 95% 62% at 50% 0%,#000 0%,transparent 72%)}
.shapes{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.shapes i{position:absolute;display:block;opacity:.14;animation:drift var(--d) ease-in-out infinite alternate;will-change:transform}
@keyframes drift{from{transform:translateY(-16px) rotate(-6deg)}to{transform:translateY(18px) rotate(14deg)}}

main{max-width:480px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 4px 18px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.gear{all:unset;box-sizing:border-box;width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:19px;cursor:pointer;
background:var(--glass);border:1px solid var(--line);border-radius:16px;transition:transform .15s}
.gear:active{transform:scale(.9) rotate(-15deg)}
.glass{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--line);border-radius:16px;
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;
background:linear-gradient(115deg,rgba(255,255,255,.13) 0%,transparent 32%)}
.hero{display:flex;align-items:center;gap:18px;padding:20px;margin-bottom:12px;animation:cardIn .5s cubic-bezier(.2,.8,.2,1) backwards}
.hero p{margin:4px 0 0;color:var(--mut);font-size:14px}
.rw{position:relative;flex:none}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc b{font-size:34px;font-weight:800;line-height:1;white-space:nowrap}.rc span{font-size:12px;color:var(--mut)}
.ring{transform:rotate(-90deg);display:block}
.hero .ring{filter:drop-shadow(0 0 14px rgba(139,123,255,.35))}
.trk,.arc{fill:none;stroke-width:9}.trk{stroke:rgba(255,255,255,.09)}
.arc{stroke-linecap:round;stroke-dasharray:264;animation:fill 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes fill{from{stroke-dashoffset:264}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{all:unset;box-sizing:border-box;position:relative;overflow:hidden;cursor:pointer;padding:16px;min-height:150px;display:flex;flex-direction:column;
background:var(--glass);border:1px solid var(--line);border-radius:16px;transition:transform .15s;animation:cardIn .5s cubic-bezier(.2,.8,.2,1) backwards}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--a),var(--b))}
.card:active{transform:scale(.96)}.card:focus-visible{outline:2px solid var(--a)}
.card.wide{grid-column:span 2;min-height:130px}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,var(--a),var(--b));position:relative;
box-shadow:0 8px 24px -8px var(--a);animation:floatI 3.2s ease-in-out infinite alternate}
@keyframes floatI{from{transform:translateY(-2px) rotate(-3deg)}to{transform:translateY(3px) rotate(3deg)}}
.card .t{margin-top:12px;font-weight:700;color:var(--mut);font-size:14px}
.v{margin-top:auto;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.v small{font-size:13px;font-weight:600;color:var(--mut);margin-left:5px;letter-spacing:0}
.n{font-size:11px;color:var(--mut);margin-top:2px}
.pb{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin-top:10px;overflow:hidden}
.pb i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.badge{margin-top:18px;font-size:12px;color:#3CFFB0;font-weight:700;text-align:center;min-height:16px}
.pad{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;
height:74vh;height:72dvh;border-radius:28px;font-size:38px;font-weight:800;letter-spacing:-.02em;text-align:center;cursor:pointer;touch-action:manipulation;
color:#fff;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 20px 70px -10px var(--a);transition:filter .15s;position:relative;overflow:hidden}
.pad:active{filter:brightness(.92)}
.pad::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;transform:skewX(-22deg);
background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,55%{left:-70%}85%,100%{left:135%}}
.pad small{font-size:15px;font-weight:500;opacity:.8;letter-spacing:0}
.q{font-size:25px;font-weight:800;line-height:1.25;letter-spacing:-.01em;margin:14px 4px 20px;animation:cardIn .35s cubic-bezier(.2,.8,.2,1)}
.opt{all:unset;box-sizing:border-box;display:block;width:100%;padding:17px 18px;margin-bottom:10px;cursor:pointer;font-weight:700;
background:var(--glass);border:1px solid var(--line);border-radius:14px;transition:background .2s,transform .15s;animation:cardIn .3s cubic-bezier(.2,.8,.2,1) backwards}
.opt:active{transform:scale(.98)}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
#stage > div > .bar{margin-top:54px}
.mwrap .mtop{margin-top:46px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .3s}
.res{text-align:center;padding:32px 20px 28px;animation:cardIn .45s cubic-bezier(.2,.8,.2,1)}
.res.record{box-shadow:0 0 0 1px var(--a) inset,0 24px 70px -20px var(--a)}
.tag{display:inline-block;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:800;margin-bottom:14px;
background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 8px 24px -8px var(--a)}
.res .rw{width:fit-content;margin:0 auto 14px}.res .rc b{font-size:46px}
.res .ring{filter:drop-shadow(0 0 18px rgba(139,123,255,.3))}
.res p{color:var(--mut);margin:10px 0 0}
.btn{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;margin-top:12px;padding:16px;cursor:pointer;font-weight:800;
background:var(--glass);border:1px solid var(--line);border-radius:14px;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--tx);color:var(--bg);border-color:transparent}

/* confetti on new record */
.fx{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.fx b{position:absolute;top:42%;left:50%;width:8px;height:13px;border-radius:2px;opacity:0;
animation:burst var(--t) cubic-bezier(.15,.55,.4,1) forwards}
@keyframes burst{
 0%{opacity:1;transform:translate(-50%,-50%) rotate(0deg) translate(0,0)}
 100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) translate(var(--x),var(--y))}}

/* игра в память */
.mwrap{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:24px;color:#fff;
background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 20px 70px -10px var(--a)}
.mtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mtop b{font-size:20px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.mtop small{font-size:14px;font-weight:600;opacity:.85;text-align:right;min-width:0}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcell{all:unset;box-sizing:border-box;aspect-ratio:1;min-height:64px;border-radius:12px;background:rgba(255,255,255,.14);
border:1px solid rgba(255,255,255,.25);cursor:pointer;transition:background .15s,transform .15s;display:grid;place-items:center}
.mcell:active{transform:scale(.94)}
.mcell.on{background:rgba(255,255,255,.95);transform:scale(1.07)}
.mcell.ok{background:rgba(60,255,176,.7);border-color:transparent}
.mcell.bad{background:rgba(255,64,64,.75);border-color:transparent}
.mbar{height:6px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}
.mbar i{display:block;height:100%;background:rgba(255,255,255,.95);transition:width .4s}

/* кнопка завершения */
.exbtn{all:unset;box-sizing:border-box;position:fixed;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 14px));transform:translateX(-50%);
z-index:40;width:min(448px,calc(100% - 32px));padding:14px;cursor:pointer;font-weight:700;font-size:15px;text-align:center;color:#fff;
background:rgba(20,18,45,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;transition:transform .15s}
.exbtn:active{transform:translateX(-50%) scale(.97)}
#stage{padding-bottom:92px}

/* модальное окно подтверждения */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(6,5,20,.6);
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .2s}
.modal.show{opacity:1}
.mbox{width:100%;max-width:340px;padding:24px 20px;border-radius:20px;text-align:center;background:#171532;border:1px solid var(--line);
transform:scale(.92);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.modal.show .mbox{transform:scale(1)}
.mbox p{margin:0;font-size:20px;font-weight:800}
.mbox small{display:block;margin:8px 0 18px;color:var(--mut);font-size:13.5px}
/* шапка, аватар, статистика, вкладка заданий */
.who{display:flex;align-items:center;gap:11px;min-width:0}
.ava{flex:none;width:52px;height:52px;border-radius:50%;background:var(--glass) center/cover no-repeat;border:none;
display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 0 0 2px var(--line),0 6px 18px -6px rgba(139,123,255,.55)}
.ava.fb{background:linear-gradient(135deg,#8B7BFF,#4FC3FF);color:#fff;border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.st{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:13px 8px;text-align:center}
.st b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.st span{font-size:11.5px;color:var(--mut)}
.go{all:unset;box-sizing:border-box;width:100%;margin-top:14px;padding:17px;border-radius:16px;display:flex;align-items:center;gap:12px;cursor:pointer;
font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,#5F45FF,#B44CFF);box-shadow:0 16px 40px -14px #5F45FF;transition:transform .15s}
.go:active{transform:scale(.98)}
.go i{margin-left:auto;font-style:normal;opacity:.75;font-size:20px}
.goi{font-size:20px}
.tpill{padding:8px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-weight:800;font-size:14px}
.card .num{position:absolute;top:14px;right:16px;font-size:13px;font-weight:800;color:var(--mut);opacity:.75}
.mxgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px auto;max-width:280px}
.anrow{display:flex;gap:10px;justify-content:center;align-items:center;margin:6px 0}
.anrow .mxcell{width:62px;height:62px;flex:none;padding:3px}
.anarr{color:var(--mut);font-size:22px;font-weight:800}
.mxcell{aspect-ratio:1;border-radius:12px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;padding:4px}
.mxcell.qmark{color:var(--mut);font-size:26px;font-weight:800}
.mxcell.q{font-size:28px;font-weight:800;color:var(--mut)}
.shopts{display:grid;grid-template-columns:1fr;justify-items:start;gap:9px;margin-top:20px}
.shopt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;max-width:240px;padding:6px;border-radius:12px;background:var(--glass);border:1px solid var(--line);cursor:pointer;transition:transform .15s;animation:cardIn .3s cubic-bezier(.2,.8,.2,1) backwards}
.shnum{flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;font-style:normal;background:rgba(255,255,255,.12)}
.shfig{flex:none;width:50px;height:50px}
.shopt:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="shapes" id="shapes"></div>
<main>
  <section id="home">
    <div class="top"><div class="who"><span class="ava" id="ava" aria-hidden="true"></span><h1 id="hello">Привет!</h1></div><button class="gear" id="reset" aria-label="Сбросить прогресс">⚙️</button></div>
    <div id="list"></div>
    <div class="badge" id="badge"></div>
  </section>
  <section id="tasks" hidden>
    <div class="top"><h1>Задания</h1><span class="tpill" id="tprog"></span></div>
    <div id="tlist"></div>
  </section>
  <section id="stage" hidden></section>
</main>

<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
try { tg.setHeaderColor('#0B0A1F'); tg.setBackgroundColor('#0B0A1F'); } catch {}
const $ = s => document.querySelector(s);
const haptic = (type, style) => { try { type === 'notify' ? tg.HapticFeedback?.notificationOccurred(style) : tg.HapticFeedback?.impactOccurred(style); } catch {} };

// плавающие декоративные объекты на фоне
(function(){
  const shapes = [
    { s:14, r:'50%',      c:'#8B7BFF', t:'6%',  l:'10%', d:'7s'  },
    { s:22, r:'0',        c:'#FF5C8A', t:'18%', l:'84%', d:'9s',  ring:1, br:'2px' },
    { s:16, r:'6px',      c:'#3CFFB0', t:'58%', l:'6%',  d:'8s',  rot:1 },
    { s:26, r:'50%',      c:'#4FC3FF', t:'74%', l:'88%', d:'10s', ring:1, br:'2px' },
    { s:10, r:'2px',      c:'#FF9A5C', t:'38%', l:'92%', d:'6s'  },
    { s:12, r:'50%',      c:'#FF3D8B', t:'88%', l:'16%', d:'8.5s' }
  ];
  $('#shapes').innerHTML = shapes.map(s =>
    `<i style="width:${s.s}px;height:${s.s}px;top:${s.t};left:${s.l};background:${s.ring ? 'transparent' : s.c};${s.ring ? `border:${s.br} solid ${s.c}` : ''};${s.rot ? 'transform:rotate(45deg);' : ''}border-radius:${s.r};--d:${s.d}"></i>`).join('');
})();

// initDataUnsafe — только для показа имени и аватара. Доверенная проверка идёт на сервере (/api/verify).
const tgu = tg.initDataUnsafe?.user;
$('#hello').textContent = 'Привет, ' + (tgu?.first_name || 'гость');
{
  const ava = $('#ava');
  if (tgu?.photo_url) ava.style.backgroundImage = `url(${JSON.stringify(tgu.photo_url)})`;
  else { ava.textContent = tgu?.first_name ? tgu.first_name[0].toUpperCase() : '👤'; ava.classList.add('fb'); }
}

const cloud = tg.initData && tg.isVersionAtLeast?.('6.9') && tg.CloudStorage;
const parse = s => { try { return JSON.parse(s) || {}; } catch { return {}; } };
let best = {};
const load = cb => cloud ? tg.CloudStorage.getItem('best', (e, v) => cb(parse(v))) : cb(parse(localStorage.getItem('best')));
const save = () => { const s = JSON.stringify(best); cloud ? tg.CloudStorage.setItem('best', s) : (() => { try { localStorage.setItem('best', s); } catch {} })(); };
// поддержка старого формата данных (best[key] был просто числом)
const normalize = raw => { const out = {}; META.forEach(m => { const r = raw[m.key]; if (r == null) return;
  out[m.key] = (typeof r === 'object' && r.v != null) ? { v: r.v, n: r.n || 1 } : { v: r, n: 1 }; }); return out; };

const clamp = x => Math.max(0, Math.min(1, x));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const META = [
  { key:'reaction', title:'Реакция',        icon:'⚡', a:'#FF5C8A', b:'#FF9A5C', unit:'мс',    rule:'min', norm:v => (500 - v) / 350 },
  { key:'logic',    title:'Логика',         icon:'🧩', a:'#FF6FD8', b:'#B24DFF', unit:'из 10', rule:'max', norm:v => v / 10 },
  { key:'taps',     title:'Скорость тапов', icon:'👆', a:'#3CFFB0', b:'#3CB4FF', unit:'тап/с', rule:'max', norm:v => v / 10 },
  { key:'memory',   title:'Память',         icon:'🎴', a:'#FFD34D', b:'#FF7A3D', unit:'из 10', rule:'max', norm:v => v / 10 },
  { key:'iq',       title:'IQ',             icon:'🧠', a:'#4FC3FF', b:'#5F45FF', unit:'IQ',    rule:'max', norm:v => clamp((v - 55) / 95) },
];

const ring = (p, a, b, size) => {
  const id = 'g' + Math.random().toString(36).slice(2);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 100 100"><defs><linearGradient id="${id}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>
  <circle class="trk" cx="50" cy="50" r="42"/><circle class="arc" cx="50" cy="50" r="42" stroke="url(#${id})" style="stroke-dashoffset:${264*(1-clamp(p))}"/></svg>`;
};
function countUp(el, to, dec = 0){
  const t0 = performance.now();
  (function f(t){ const k = clamp((t - t0) / 900), e = 1 - Math.pow(1 - k, 3);
    el.textContent = (to * e).toFixed(dec); if (k < 1) requestAnimationFrame(f); })(t0);
}
async function shareResult(text){
  try {
    await navigator.clipboard.writeText(text);
    haptic('notify', 'success');
    tg.showPopup ? tg.showPopup({ message: 'Скопировано! Вставь в любой чат.' }) : alert('Скопировано!');
  } catch {
    tg.showPopup ? tg.showPopup({ message: text }) : alert(text);
  }
}
// конфетти при новом рекорде; контейнер сам удаляется, клики не блокирует
function confetti(colors){
  const fx = document.createElement('div'); fx.className = 'fx';
  for (let i = 0; i < 28; i++){
    const b = document.createElement('b'), a = Math.random() * Math.PI * 2,
          d = 80 + Math.random() * 140;
    b.style.cssText = `background:${colors[i % colors.length]};--x:${Math.round(Math.cos(a) * d)}px;--y:${Math.round(Math.sin(a) * d + 40)}px;--r:${Math.round(Math.random() * 720 - 360)}deg;--t:${(0.9 + Math.random() * 0.6).toFixed(2)}s;animation-delay:${(Math.random() * 0.12).toFixed(2)}s`;
    fx.appendChild(b);
  }
  document.body.appendChild(fx);
  setTimeout(() => fx.remove(), 1900);
}

function askModal(title, note, onYes){
  haptic('impact', 'light');
  const ov = document.createElement('div');
  ov.className = 'modal';
  ov.innerHTML = `<div class="mbox"><p>${title}</p><small>${note}</small>
    <button class="btn main" id="myes">Да, завершить</button><button class="btn" id="mno">Продолжить</button></div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add('show'));
  const close = () => { ov.classList.remove('show'); setTimeout(() => ov.remove(), 200); };
  ov.querySelector('#myes').onclick = () => { close(); onYes(); };
  ov.querySelector('#mno').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };
}

function wireExit(g, direct){
  const b = document.getElementById('exit');
  if (!b) return;
  b.onclick = () => {
    if (g !== gen) return;
    if (direct) return show('home');
    askModal('Завершить тест?', 'Результат не будет сохранён', () => { gen++; show('home'); });
  };
}

function renderHome(){

// защита от «протухших» таймеров: любая навигация/старт теста увеличивает gen,

let gen = 0;

tg.BackButton.onClick(() => show('home'));

const accent = m => `--a:${m.a};--b:${m.b}`;
function finish(key, value, verdict){
  if (typeof key === 'number') return; // страховка от вызова с устаревшим gen
  const m = META.find(x => x.key === key);
  const prev = best[key];
  const isRecord = !prev || (m.rule === 'max' ? value > prev.v : value < prev.v);
  best[key] = { v: isRecord ? value : prev.v, n: (prev?.n || 0) + 1 };
  save();
  haptic('notify', isRecord ? 'success' : 'warning');

    <h2>${verdict}</h2>

  countUp($('#cnt'), value, key === 'taps' ? 1 : 0);

// --- IQ-тест: картиночные задания (матрицы, ряды, «найди лишнее») + подсчёт с поправкой на возраст ---
const IQ_SH = ['circle','square','triangle','diamond','hexagon','star'];
const IQ_COL = ['#8B7BFF','#FF5C8A','#3CFFB0','#FFD34D','#4FC3FF','#FF9A5C'];
const iqDraw = (shape, r) => {
  if (shape === 'circle') return `<circle cx="30" cy="30" r="${r}"/>`;
  if (shape === 'square') return `<rect x="${30-r}" y="${30-r}" width="${r*2}" height="${r*2}" rx="${r*.14}"/>`;
  if (shape === 'triangle') return `<polygon points="30,${30-r} ${30+r*.87},${30+r*.5} ${30-r*.87},${30+r*.5}"/>`;
  if (shape === 'diamond') return `<polygon points="30,${30-r} ${30+r},30 30,${30+r} ${30-r},30"/>`;
  if (shape === 'hexagon') { const p = []; for (let k=0;k<6;k++){ const a = Math.PI/3*k - Math.PI/2; p.push(`${30+Math.cos(a)*r},${30+Math.sin(a)*r}`); } return `<polygon points="${p.join(' ')}"/>`; }
  const p = []; for (let k=0;k<10;k++){ const a = Math.PI/5*k - Math.PI/2, rr = k%2 ? r*.45 : r; p.push(`${30+Math.cos(a)*rr},${30+Math.sin(a)*rr}`); } return `<polygon points="${p.join(' ')}"/>`;
};
const iqSVG = (o) => {
  const g = o.stroke ? `fill="none" stroke="${o.color}" stroke-width="4"` : `fill="${o.color}"`;
  return `<svg viewBox="0 0 60 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet"><g ${g}>${iqPlace(o.shape, o.r, o.count, o.rot)}</g></svg>`;
};
const iqSame = (a, b) => a.shape===b.shape && a.color===b.color && a.r===b.r && (a.count||1)===(b.count||1) && (a.rot||0)===(b.rot||0) && !!a.stroke===!!b.stroke;
// раскладка фигур внутри ячейки 60x60; rot — только для «видимых» форм (треугольник)
const iqPlace = (shape, r, count, rot) => {
  count = count || 1;
  if (count === 1) {
    const d = iqDraw(shape, r);
    return rot ? `<g transform="rotate(${rot} 30 30)">${d}</g>` : d;
  }
  const spots = count === 2 ? [[17,30],[43,30]] :
    count === 3 ? [[13,30],[30,30],[47,30]] :
    count === 4 ? [[19,19],[41,19],[19,41],[41,41]] :
    count === 5 ? [[17,17],[43,17],[30,30],[17,43],[43,43]] :
                  [[13,19],[30,19],[47,19],[13,41],[30,41],[47,41]];
  const cr = count <= 2 ? 11 : count <= 4 ? 10 : 9;
  return spots.map(([x,y]) => `<g transform="translate(${x-30},${y-30})">${iqDraw(shape, cr)}</g>`).join('');
};

const iqPick = (arr, ...nots) => { let v; do { v = arr[Math.floor(Math.random()*arr.length)]; } while (nots.includes(v)); return v; };
const ROT_SH = ['triangle']; // формы, у которых поворот реально виден

// дистракторы как в матрицах Равена: каждый отличается от правильного ровно одним признаком
// видимый ключ: при count>1 размер не виден; поворот виден только у треугольника (симметрия 120°)
const iqVKey = o => JSON.stringify([o.shape, o.color, (o.count||1) > 1 ? 0 : o.r, o.count||1,
  o.shape === 'triangle' ? (o.rot||0) % 120 : 0, !!o.stroke]);
function iqDistractors(correct, pool){
  const cand = [];
  const add = c => { if (c && !cand.some(o => iqVKey(o) === iqVKey(c)) && iqVKey(c) !== iqVKey(correct)) cand.push(c); };
  (pool.shapes||[]).forEach(s2 => add({...correct, shape:s2}));
  (pool.colors||[]).forEach(c2 => add({...correct, color:c2}));
  (pool.sizes||[]).forEach(v => add({...correct, r:v}));
  (pool.counts||[]).forEach(v => add({...correct, count:v}));
  (pool.rots||[]).forEach(v => add({...correct, rot:v}));
  return shuffle(cand).slice(0, 4);
}

function iqGenMatrix(level){
  // 1: форма — латинский квадрат, цвет — по строке
  // 2: форма и цвет — два независимых латинских квадрата
  // 3: + размер по столбцу (шаги видны глазу)
  // 4 (супер): форма+цвет квадраты, количество по столбцу — три правила сразу
  // правило количества видно только при count>1; размер при count>1 не виден (см. iqVKey)
  const shapes = shuffle(IQ_SH).slice(0,3), colors = shuffle(IQ_COL).slice(0,3);
  const sizes3 = [8,18,28], counts3 = [1,2,3];
  let cell;
  if (level === 1){
    cell = (r,c) => ({ shape:shapes[(c+r)%3], color:colors[r], r:17, count:1, rot:0, stroke:false });
  } else if (level === 2){
    cell = (r,c) => ({ shape:shapes[(c+r)%3], color:colors[(c+r*2)%3], r:17, count:1, rot:0, stroke:false });
  } else if (level === 3){
    cell = (r,c) => ({ shape:shapes[(c+r)%3], color:colors[r], r:sizes3[c], count:1, rot:0, stroke:false });
  } else {
    cell = (r,c) => ({ shape:shapes[(c+r)%3], color:colors[(c+r*2)%3], r:11, count:c+1, rot:0, stroke:false });
  }
  const correct = cell(2,2);
  // дистракторы собираем только из формы/цвета/размера/количества, которые реально встречаются
  // где-то в сетке (просто не в этой клетке) — так вариант нельзя отбросить методом "такого я
  // тут вообще не видел", не решая саму логическую задачу
  const pool = {
    shapes: shapes.filter(s2 => s2 !== correct.shape),
    colors: colors.filter(c2 => c2 !== correct.color),
  };
  if (level === 3) pool.sizes = sizes3.filter(v => v !== correct.r);
  if (level === 4) pool.counts = counts3.filter(v => v !== correct.count);
  const opts = shuffle([correct, ...iqDistractors(correct, pool)]);
  return { type:'matrix', cell, correct, opts };
}

function iqGenSeries(kind){
  const shape = IQ_SH[Math.floor(Math.random()*IQ_SH.length)];
  const color = IQ_COL[Math.floor(Math.random()*IQ_COL.length)];
  const color2 = iqPick(IQ_COL, color);
  let shown, correct, pool;
  if (kind === 'count'){
    shown = [1,2,3,4].map(n => ({shape, color, r:10, count:n, rot:0, stroke:false}));
    correct = {shape, color, r:10, count:5, rot:0, stroke:false};
    pool = { counts:[2,3,6], colors:[iqPick(IQ_COL, color)] };
  } else if (kind === 'size'){
    shown = [4,12,20].map(v => ({shape, color, r:v, count:1, rot:0, stroke:false}));
    correct = {shape, color, r:28, count:1, rot:0, stroke:false};
    pool = { sizes:[6,14,22], counts:[2] };
  } else if (kind === 'fibo'){
    shown = [1,1,2,3].map(n => ({shape, color, r:10, count:n, rot:0, stroke:false}));
    correct = {shape, color, r:10, count:5, rot:0, stroke:false};
    pool = { counts:[2,4,6], colors:[iqPick(IQ_COL, color)] };
  } else if (kind === 'rot'){
    shown = [0,45,90,135].map(v => ({shape:'triangle', color, r:17, count:1, rot:v, stroke:false}));
    correct = {shape:'triangle', color, r:17, count:1, rot:180, stroke:false};
    pool = { rots:[90,225,270,315] };
  } else if (kind === 'dual'){
    shown = [1,2,3,4].map((n,i) => ({shape, color: i%2 ? color2 : color, r:10, count:n, rot:0, stroke:false}));
    correct = {shape, color, r:10, count:5, rot:0, stroke:false};
    pool = { counts:[3,4,6], colors:[color2] };
  } else { // супер: два чередующихся ряда — нечётные позиции растут по количеству, чётные по размеру
    shown = [
      {shape, color, r:10, count:1, rot:0, stroke:false},
      {shape, color, r:13, count:1, rot:0, stroke:false},
      {shape, color, r:10, count:2, rot:0, stroke:false},
      {shape, color, r:20, count:1, rot:0, stroke:false},
      {shape, color, r:10, count:3, rot:0, stroke:false},
    ];
    correct = {shape, color, r:27, count:1, rot:0, stroke:false};
    pool = { sizes:[12,21], counts:[2,4] };
  }
  const opts = shuffle([correct, ...iqDistractors(correct, pool)]);
  return { type:'series', shown, correct, opts };
}

function iqGenOdd(kind){
  const shape = IQ_SH[Math.floor(Math.random()*IQ_SH.length)];
  const color = IQ_COL[Math.floor(Math.random()*IQ_COL.length)];
  const color2 = iqPick(IQ_COL, color);
  let items, oddIdx;
  if (kind === 'count'){ // ряд 1-5 по возрастанию, одна карточка выпадает (вместо неё 6)
    oddIdx = Math.floor(Math.random()*5);
    items = Array.from({length:5}, (_,i) => ({shape, color, r:10, count:i+1, rot:0, stroke:false}));
    items[oddIdx] = {shape, color, r:10, count:6, rot:0, stroke:false};
  } else if (kind === 'rot'){ // поворот +45° на шаг, одна карточка сбивает последовательность
    oddIdx = 1 + Math.floor(Math.random()*3);
    items = Array.from({length:5}, (_,i) => ({shape:'triangle', color, r:17, count:1, rot:i*45, stroke:false}));
    const norm = v => ((v % 120) + 120) % 120;
    const taken = new Set(items.filter((_,i)=>i!==oddIdx).map(x => norm(x.rot)));
    let cand = oddIdx*45 + 90;
    while (taken.has(norm(cand)) || norm(cand) === norm(oddIdx*45)) cand += 45;
    items[oddIdx] = {shape:'triangle', color, r:17, count:1, rot:cand, stroke:false};
  } else if (kind === 'alt'){ // цвета чередуются через один (3×A, 2×B), одна из A-позиций красится в третий, нигде больше не встречающийся цвет
    // важно: ломаем только позицию из тройки (0,2,4), а не из пары (1,3) — иначе после замены
    // останется "осиротевшая" единственная B-карточка и получатся сразу два одинаково уникальных элемента
    oddIdx = [0,2,4][Math.floor(Math.random()*3)];
    const oddColor = iqPick(IQ_COL, color, color2);
    items = Array.from({length:5}, (_,i) => ({shape, color: i%2 ? color2 : color, r:15, count:1, rot:0, stroke:false}));
    items[oddIdx] = {shape, color: oddColor, r:15, count:1, rot:0, stroke:false};
  } else { // сложно: форма и цвет идут двумя параллельными циклами, сбит цветовой
    const shapes = shuffle(IQ_SH).slice(0,3), colors = shuffle(IQ_COL).slice(0,3);
    // позиция сбоя — только там, где цвет повторяется (иначе палитра схлопнется до 2 цветов и возникнет двусмысленность)
    oddIdx = [0,1,3,4][Math.floor(Math.random()*4)];
    items = Array.from({length:5}, (_,i) => ({shape:shapes[i%3], color:colors[i%3], r:13, count:1, rot:0, stroke:false}));
    items[oddIdx] = {...items[oddIdx], color:colors[(oddIdx+1)%3]};
  }
  return { type:'odd', items, oddIdx };
}

function iqGenAnalogy(kind){
  const usesRot = kind === 'rot' || kind === 'rotstroke';
  const shape = usesRot ? 'triangle' : IQ_SH[Math.floor(Math.random()*IQ_SH.length)];
  const color = IQ_COL[Math.floor(Math.random()*IQ_COL.length)];
  const A = {shape, color, r:12, count:1, rot:0, stroke:false};
  let T;
  if (kind === 'size')      T = o => ({...o, r:24});
  else if (kind === 'stroke') T = o => ({...o, stroke:true});
  else if (kind === 'rot')  T = o => ({...o, rot:90});
  else                      T = o => ({...o, rot:90, stroke:true}); // сложно: поворот + обводка
  const B = T(A);
  const C = {...A, shape: usesRot ? 'triangle' : iqPick(IQ_SH, shape), color: usesRot ? iqPick(IQ_COL, color) : color};
  const correct = T(C);
  const opts = [correct];
  const push = o => { if (o && !opts.some(x => iqSame(x, o)) && !iqSame(o, correct) && opts.length < 5) opts.push(o); };
  if (kind === 'size'){
    push({...C});                                          // без изменения
    push({...C, r:18});                                    // половинное изменение
    push({...C, r:6});                                     // не туда
    push({...correct, color: iqPick(IQ_COL, correct.color)}); // лишняя смена цвета
  } else if (kind === 'stroke'){
    push({...C});                                          // без изменения
    push({...correct, color: iqPick(IQ_COL, correct.color)});
    push({...correct, r:20});
    push({...C, r:20});                                    // только размер
  } else if (kind === 'rot'){
    push({...C});                                          // без поворота
    push({...C, rot:45});
    push({...C, rot:180});
    push({...C, rot:270});
  } else {
    push({...C});                                          // ничего
    push({...C, rot:90});                                  // только поворот
    push({...C, stroke:true});                             // только обводка
    push({...correct, rot:180});                           // не тот поворот
  }
  return { type:'analogy', A, B, C, correct, opts: shuffle(opts) };
}

// --- семейство «точки в сетке»: ячейка = N точек одного цвета; правила по количеству и цвету ---
function iqGenDots(kind){
  const counts = shuffle([1,2,3,4]).slice(0,3); // значения количества (по столбцам)
  const colors = shuffle(IQ_COL).slice(0,3);
  let cell;
  if (kind === 'count'){        // количество по столбцу, цвет по строке
    cell = (r,c) => ({ dots: counts[c], color: colors[r] });
  } else if (kind === 'diag'){  // количество по диагональному правилу (r+c)
    cell = (r,c) => ({ dots: counts[(r+c)%3], color: colors[r] });
  } else {                      // супер: два правила одновременно
    cell = (r,c) => ({ dots: counts[c], color: colors[(r+c)%3] });
  }
  const correct = cell(2,2);
  // как и в матрицах: дистракторы — только количества/цвета, реально встречающиеся в сетке
  // (просто не в этой клетке), чтобы число вариантов и сама логика совпадали с остальными заданиями
  const pool = {
    dots: counts.filter(d => d !== correct.dots),
    colors: colors.filter(c => c !== correct.color),
  };
  const opts = shuffle([correct, ...iqDotDistractors(correct, pool)]);
  return { type:'dots', cell, correct, opts };
}
function iqDotDistractors(correct, pool){
  const cand = [];
  const add = o => { if (!cand.some(x => x.dots===o.dots && x.color===o.color) && !(o.dots===correct.dots && o.color===correct.color)) cand.push(o); };
  pool.dots.forEach(d => add({ dots:d, color:correct.color }));
  (pool.colors||[]).forEach(c => add({ dots:correct.dots, color:c }));
  return shuffle(cand).slice(0,4);
}
const iqDotSVG = o => iqSVG({ shape:'circle', color:o.color, r:9, count:o.dots, rot:0, stroke:false });
const iqDotSame = (a, b) => a.dots===b.dots && a.color===b.color;

const IQ_PLAN = [
  () => iqGenMatrix(1),
  () => iqGenMatrix(2), () => iqGenMatrix(2),
  () => iqGenMatrix(3), () => iqGenMatrix(3),
  () => iqGenMatrix(4),                                            // супер
  () => iqGenDots('count'), () => iqGenDots('diag'), () => iqGenDots('super'),
  () => iqGenSeries('count'),
  () => iqGenSeries('size'),
  () => iqGenSeries('fibo'),
  () => iqGenSeries('rot'),
  () => iqGenSeries('dual'),
  () => iqGenSeries('super'),                                      // супер
  () => iqGenOdd('count'),
  () => iqGenOdd('rot'),
  () => iqGenOdd('alt'),
  () => iqGenOdd('cycle'),                                         // сложно
  () => iqGenAnalogy('size'),
  () => iqGenAnalogy('stroke'),
  () => iqGenAnalogy('rot'),
  () => iqGenAnalogy('rotstroke'),                                 // сложно
];

// ожидаемая доля правильных ответов для среднего IQ=100 в данном возрасте (как возрастные нормы в реальных тестах)
function iqAgeExpected(age){
  if (age <= 6) return .28; if (age <= 8) return .36; if (age <= 10) return .44; if (age <= 12) return .50;
  if (age <= 14) return .55; if (age <= 17) return .60; if (age <= 29) return .64; if (age <= 44) return .61;
  if (age <= 59) return .56; if (age <= 69) return .50; return .44;
}
function iqCalc(correct, total, age){
  const z = (correct/total - iqAgeExpected(age)) / .155;
  return Math.max(55, Math.min(150, Math.round(100 + z*15)));
}
function iqVerdict(score){
  if (score >= 135) return 'Уровень гения';
  if (score >= 120) return 'Значительно выше среднего';
  if (score >= 110) return 'Выше среднего';
  if (score >= 90)  return 'Средний уровень';
  if (score >= 80)  return 'Немного ниже среднего';
  return 'Есть куда расти';
}

const padStyle = k => accent(META.find(m => m.key === k));
const TESTS = {
  reaction(g){
    const t = []; let n = 0, t0, timer;
    const round = () => {
      $('#stage').innerHTML = `<button class="pad" id="p" style="${padStyle('reaction')}">Жди зелёного<small>Раунд ${n+1} из 3</small></button><button class="exbtn" id="exit">Завершить</button>`;
      wireExit(g);
      const p = $('#p'); let ready = false;
      timer = setTimeout(() => { if (g !== gen) return; ready = true; p.style.cssText = '--a:#3CFFB0;--b:#3CB4FF'; p.innerHTML = 'Жми!'; t0 = performance.now(); }, 1000 + Math.random()*3000);
      p.onpointerdown = () => {
        if (g !== gen) return;
        if (!ready){ clearTimeout(timer); haptic('notify', 'error'); p.style.cssText = '--a:#8B7BFF;--b:#4FC3FF'; p.innerHTML = 'Рано!<small>Тапни, чтобы повторить раунд</small>'; p.onpointerdown = () => { if (g === gen) round(); }; return; }
        haptic('impact', 'medium');
        t.push(performance.now() - t0);
        if (++n < 3) return round();
        const v = Math.round(t.reduce((a, b) => a + b) / 3);
        finish('reaction', v, v < 220 ? 'Молниеносно!' : v < 300 ? 'Быстрее большинства' : v < 400 ? 'Нормальная реакция' : 'Ещё не проснулся?');
      };
    };
    round();
  },
  taps(g){
    const DUR = 10; let n = 0, on = false, left = DUR, iv;
    $('#stage').innerHTML = `<button class="pad" id="p" style="${padStyle('taps')}"><span id="tn">0</span><small id="tl">Жми, чтобы начать отсчёт</small></button><button class="exbtn" id="exit">Завершить</button>`;
    wireExit(g);
    const p = $('#p'), tn = $('#tn'), tl = $('#tl');
    p.onpointerdown = () => {
      if (g !== gen) return;
      tn.textContent = ++n; haptic('impact', 'light');
      if (on) return; on = true;
      tl.textContent = `Осталось ${left}с`;
      iv = setInterval(() => { if (g !== gen) return clearInterval(iv); left--; tl.textContent = `Осталось ${left}с`; if (left <= 0) clearInterval(iv); }, 1000);
      setTimeout(() => { if (g !== gen) return; p.onpointerdown = null; clearInterval(iv); const v = +(n/DUR).toFixed(1);
        finish('taps', v, v >= 8 ? 'Пальцы-пулемёты!' : v >= 5 ? 'Уверенный темп' : 'Разминка засчитана'); }, DUR*1000);
    };
  },
  logic(g){
    // только текстовые задачи — визуальные (матрицы/ряды) остались в IQ-тесте
    // дедукция: порядок, сравнения
    const DED = [
      ['Аня старше Бори, а Боря старше Вики. Кто самый младший?', ['Аня','Боря','Вика','Все ровесники'], 'Вика'],
      ['В забеге Дима пришёл раньше Миши, но позже Саши. Кто победил?', ['Дима','Миша','Саша','Нельзя определить'], 'Саша'],
      ['Ручка дороже тетради, а тетрадь дороже линейки. Что дешевле всех?', ['Ручка','Тетрадь','Линейка','Одинаково'], 'Линейка'],
      ['У Лены столько же конфет, сколько у Оли. Оля отдала ей 2 конфеты. На сколько теперь у Лены конфет больше?', ['На 2','На 3','На 4','Поровну'], 'На 4'],
      ['Саша выше Пети, Петя выше Коли. Кто ниже всех?', ['Саша','Петя','Коля','Одинаковые'], 'Коля'],
    ];
    // вербальная логика
    const VRB = [
      ['Врач — «лечит», судья — …', ['судит','решает','приговаривает','обвиняет'], 'судит'],
      ['Какое слово лишнее: весы, грусть, радость, скука?', ['весы','грусть','радость','скука'], 'весы'],
      ['Все розы — цветы. Некоторые цветы увядают. Значит, некоторые розы увядают?', ['Да','Нет','Нельзя сказать','Все розы'], 'Нельзя сказать'],
      ['Найди аналогию: Книга — Библиотека, как Картина — …', ['Художник','Музей','Рама','Кисть'], 'Музей'],
      ['Найди аналогию: Птица — Гнездо, как Пчела — …', ['Мёд','Улей','Цветок','Жало'], 'Улей'],
    ];
    // комбинаторика и смекалка посерьёзнее
    const LOG = [
      ['Одно яйцо варится 4 минуты. Сколько минут варятся 5 яиц?', ['4','8','16','20'], '4'],
      ['Сколько раз можно вычесть 5 из 25?', ['Один','Пять','Десять','Бесконечно'], 'Один'],
      ['Двое подошли к реке с разных берегов. У берега лодка, выдерживающая только одного. Оба переправились. Как?', ['С разных берегов по очереди','Вдвоём','Вплавь','Так нельзя'], 'С разных берегов по очереди'],
      ['В корзине 5 яблок. Раздай их пятерым так, чтобы каждому досталось по яблоку и одно осталось в корзине.', ['Отдать корзину с яблоком','Разрезать яблоко','Это невозможно','Оставить себе'], 'Отдать корзину с яблоком'],
      ['Термометр показывает 15 градусов. Сколько градусов покажут два таких термометра?', ['15','30','45','60'], '15'],
    ];
    // загадки на смекалку
    const POOL = [
      ['Что можно увидеть с закрытыми глазами?', ['Сон','Свет','Тьму','Ничего'], 'Сон'],
      ['У отца Марии пять дочерей: Хахаха, Хихихи, Хохохо, Хюхюхю и …?', ['Хахаха','Мария','Хыхыхы','Смехуля'], 'Мария'],
      ['Что становится больше, если его перевернуть?', ['Число 6','Стол','Бутылка','Стакан'], 'Число 6'],
      ['Найди лишнее: молоток, отвёртка, пила, яблоко', ['молоток','отвёртка','пила','яблоко'], 'яблоко'],
      ['Сколько месяцев в году имеют 28 дней?', ['1','6','12','0'], '12'],
      ['Что идёт, не двигаясь с места?', ['Часы','Дорога','Время','Река'], 'Время'],
      ['Чем больше из неё берёшь, тем больше она становится. Что это?', ['Яма','Гора','Река','Тень'], 'Яма'],
      ['Два кольца, два конца, а посередине гвоздик. Что это?', ['Ножницы','Очки','Велосипед','Наручники'], 'Ножницы'],
      ['Врач дал 3 таблетки и сказал пить по одной каждые 15 минут. На сколько хватит?', ['15 минут','30 минут','45 минут','60 минут'], '30 минут'],
      ['Раздели дюжину пополам и прибавь треть от 9. Сколько получится?', ['6','7','9','12'], '9'],
      ['Что общего у всех месяцев года?', ['У всех 31 день','Начинаются с буквы А','В каждом есть 28 дней','Заканчиваются на "рь"'], 'В каждом есть 28 дней'],
      ['Летела стая гусей: один впереди и два позади, один позади и два впереди, один между двумя и три в ряд. Сколько всего гусей?', ['3','4','5','6'], '3'],
      ['Что нельзя положить даже в самую большую комнату?', ['Тишину','Пространство','Ничего','Свет'], 'Ничего'],
      ['Каким по счёту будет слон, если он обгонит бегущего вторым?', ['Первым','Вторым','Третьим','Слоны не бегают'], 'Вторым'],
    ];
    // 10 разноплановых вопросов: 2 дедукции + 2 вербальных + 2 комбинаторики + 4 загадки
    const txt = ([q, o, a2]) => { const oo = shuffle(o); return { type:'txt', q, o: oo, ai: oo.indexOf(a2) }; };
    const Q = shuffle([...shuffle(DED).slice(0, 2), ...shuffle(VRB).slice(0, 2), ...shuffle(LOG).slice(0, 2), ...shuffle(POOL).slice(0, 4)].map(txt));
    let i = 0, correct = 0;
    const next = () => { if (g !== gen) return; if (i < Q.length) return ask();
      const v = correct, verdict = v >= 9 ? 'Гений логики!' : v >= 7 ? 'Отличный результат' : v >= 5 ? 'Неплохо!' : v >= 3 ? 'Есть куда расти' : 'Попробуй ещё раз';
      finish('logic', v, verdict); };
    const ask = () => {
      if (g !== gen) return;
      const it = Q[i];
      $('#stage').innerHTML = `<div style="${padStyle('logic')}"><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><p class="q">${it.q}</p>` +
        it.o.map((o, j) => `<button class="opt" style="animation-delay:${j*40}ms" data-j="${j}">${o}</button>`).join('') +
        `<button class="exbtn" id="exit">Завершить</button></div>`;
      wireExit(g);
      document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        if (g !== gen) return;
        const ok = +b.dataset.j === it.ai; if (ok) correct++;
        haptic('impact', ok ? 'light' : 'rigid');
        document.querySelectorAll('.opt').forEach(x => { x.onclick = null; if (+x.dataset.j === it.ai) x.style.background = 'linear-gradient(135deg,#3CFFB0,#3CB4FF)'; });
        if (!ok) b.style.background = 'linear-gradient(135deg,#FF5C8A,#FF9A5C)';
        setTimeout(() => { if (g !== gen) return; i++; next(); }, 500);
      });
    };
    ask();
  },

  memory(g){
    const N = 12, TOTAL = 10, ON = 520, GAP = 160;
    let r = 1, seq = [], pos = 0, phase = 'wait';
    $('#stage').innerHTML = `<div class="mwrap" style="${padStyle('memory')}">
      <div class="mtop"><b>Раунд 1 из ${TOTAL}</b><small id="ms">Приготовься…</small></div>
      <div class="mgrid">${Array.from({length:N}, (_,i) => `<button class="mcell" data-i="${i}" aria-label="Карта ${i+1}"></button>`).join('')}</div>
      <div class="mbar"><i id="mp" style="width:0%"></i></div></div><button class="exbtn" id="exit">Завершить</button>`;
    wireExit(g);
    const stat = t => { const el = document.getElementById('ms'); if (el) el.textContent = t; };
    const prog = w => { const el = document.getElementById('mp'); if (el) el.style.width = w + '%'; };
    const play = () => {
      if (g !== gen) return;
      phase = 'flash'; pos = 0;
      document.querySelectorAll('.mcell').forEach(c => c.classList.remove('ok', 'bad'));
      stat('Запоминай…');
      seq = shuffle(Array.from({length:N}, (_,i) => i)).slice(0, r);
      seq.forEach((ci, k) => setTimeout(() => {
        if (g !== gen) return;
        const el = document.querySelector(`.mcell[data-i="${ci}"]`);
        if (!el) return;
        el.classList.add('on');
        setTimeout(() => { if (el.isConnected) el.classList.remove('on'); }, ON);
      }, 400 + k * (ON + GAP)));
      setTimeout(() => { if (g !== gen) return; phase = 'input'; stat('Повтори по порядку'); }, 400 + seq.length * (ON + GAP));
    };
    const endRound = () => {
      if (g !== gen) return;
      prog(Math.round(r / TOTAL * 100));
      if (r >= TOTAL) { setTimeout(() => { if (g === gen) finish('memory', TOTAL, 'Фотографическая память!'); }, 650); return; }
      stat('Верно!');
      r++;
      setTimeout(() => { if (g !== gen) return;
        const t = document.querySelector('.mtop b'); if (t) t.textContent = `Раунд ${r} из ${TOTAL}`; play(); }, 850);
    };
    document.querySelectorAll('.mcell').forEach(el => el.onpointerdown = () => {
      if (g !== gen || phase !== 'input') return;
      const ci = +el.dataset.i;
      if (ci === seq[pos]) {
        pos++; haptic('impact', 'light'); el.classList.add('ok');
        if (pos >= seq.length) { phase = 'wait'; endRound(); }
      } else {
        phase = 'wait'; haptic('notify', 'error'); el.classList.add('bad');
        const done = r - 1;
        const verdict = done >= 7 ? 'Почти идеально!' : done >= 4 ? 'Хорошая память' : 'Есть куда расти';
        setTimeout(() => { if (g === gen) finish('memory', done, verdict); }, 650);
      }
    });
    setTimeout(() => { if (g === gen) play(); }, 500);
  },

  iq(g){
    const N = IQ_PLAN.length;
    const ageScreen = () => {
      $('#stage').innerHTML = `<div class="glass res" style="${padStyle('iq')}">
        <h2>Тест на IQ</h2>
        <p>${N} заданий — от простых до суперсложных: матрицы, ряды, аналогии и «найди лишнее». Результат считается с поправкой на возраст.</p>
        <input type="number" id="ageInp" inputmode="numeric" min="5" max="99" placeholder="Сколько тебе лет?" class="opt" style="text-align:center;font-weight:800;font-size:17px;margin-top:16px">
        <button class="btn main" id="ageGo" style="margin-top:12px">Начать</button></div>
        <button class="exbtn" id="exit">Завершить</button>`;
      wireExit(g);
      $('#ageGo').onclick = () => {
        if (g !== gen) return;
        const age = Math.max(5, Math.min(99, +$('#ageInp').value || 25));
        haptic('impact', 'light');
        runQuiz(age);
      };
    };
    const runQuiz = age => {
      const Q = shuffle(IQ_PLAN).map(f => f());
      let i = 0, correct = 0;
      const answer = (b, ok) => {
        if (ok) correct++;
        haptic('impact', ok ? 'light' : 'rigid');
        b.style.background = ok ? 'linear-gradient(135deg,#3CFFB0,#3CB4FF)' : 'linear-gradient(135deg,#FF5C8A,#FF9A5C)';
        document.querySelectorAll('.shopt').forEach(x => x.onclick = null);
        setTimeout(() => { if (g !== gen) return; i++; ask(); }, 500);
      };
      const ask = () => {
        if (g !== gen) return;
        if (i >= N) { const score = iqCalc(correct, N, age); return finish('iq', score, `${iqVerdict(score)} для ${age} лет`); }
        const it = Q[i];
        const bar = `<div class="bar"><i style="width:${i/N*100}%"></i></div>`;
        if (it.type === 'matrix') {
          const grid = Array.from({length:9}, (_, k) => { const r = k/3|0, c = k%3;
            return (r===2&&c===2) ? '<div class="mxcell qmark">?</div>' : `<div class="mxcell">${iqSVG(it.cell(r,c))}</div>`; }).join('');
          $('#stage').innerHTML = `<div style="${padStyle('iq')}">${bar}<p class="q" style="font-size:17px">Что должно быть вместо «?»</p>
            <div class="mxgrid">${grid}</div><div class="shopts">${it.opts.map((o, j) => `<button class="shopt"><i class="shnum">${j+1}</i><span class="shfig">${iqSVG(o)}</span></button>`).join('')}</div>
            <button class="exbtn" id="exit">Завершить</button></div>`;
          wireExit(g);
          document.querySelectorAll('.shopt').forEach((b,j) => b.onclick = () => { if (g===gen) answer(b, iqSame(it.opts[j], it.correct)); });
        } else if (it.type === 'series') {
          const row = it.shown.map(s => `<div class="mxcell">${iqSVG(s)}</div>`).join('') + '<div class="mxcell qmark">?</div>';
          $('#stage').innerHTML = `<div style="${padStyle('iq')}">${bar}<p class="q" style="font-size:17px">Продолжи закономерность</p>
            <div class="mxgrid" style="grid-template-columns:repeat(${it.shown.length+1},1fr);max-width:340px;gap:6px">${row}</div>
            <div class="shopts">${it.opts.map((o, j) => `<button class="shopt"><i class="shnum">${j+1}</i><span class="shfig">${iqSVG(o)}</span></button>`).join('')}</div>
            <button class="exbtn" id="exit">Завершить</button></div>`;
          wireExit(g);
          document.querySelectorAll('.shopt').forEach((b,j) => b.onclick = () => { if (g===gen) answer(b, iqSame(it.opts[j], it.correct)); });
        } else if (it.type === 'analogy') {
          const cellH = o => `<div class="mxcell">${iqSVG(o)}</div>`;
          $('#stage').innerHTML = `<div style="${padStyle('iq')}">${bar}<p class="q" style="font-size:17px">Первая пара задаёт правило — примени его ко второй</p>
            <div class="anrow">${cellH(it.A)}<span class="anarr">→</span>${cellH(it.B)}</div>
            <div class="anrow">${cellH(it.C)}<span class="anarr">→</span><div class="mxcell qmark">?</div></div>
            <div class="shopts">${it.opts.map((o, j) => `<button class="shopt"><i class="shnum">${j+1}</i><span class="shfig">${iqSVG(o)}</span></button>`).join('')}</div>
            <button class="exbtn" id="exit">Завершить</button></div>`;
          wireExit(g);
          document.querySelectorAll('.shopt').forEach((b,j) => b.onclick = () => { if (g===gen) answer(b, iqSame(it.opts[j], it.correct)); });
        } else if (it.type === 'dots') {
          const grid = Array.from({length:9}, (_, k) => { const r = k/3|0, c = k%3;
            return (r===2&&c===2) ? '<div class="mxcell qmark">?</div>' : `<div class="mxcell">${iqDotSVG(it.cell(r,c))}</div>`; }).join('');
          $('#stage').innerHTML = `<div style="${padStyle('iq')}">${bar}<p class="q" style="font-size:17px">Что должно быть вместо «?»</p>
            <div class="mxgrid">${grid}</div><div class="shopts">${it.opts.map((o, j) => `<button class="shopt"><i class="shnum">${j+1}</i><span class="shfig">${iqDotSVG(o)}</span></button>`).join('')}</div>
            <button class="exbtn" id="exit">Завершить</button></div>`;
          wireExit(g);
          document.querySelectorAll('.shopt').forEach((b,j) => b.onclick = () => { if (g===gen) answer(b, iqDotSame(it.opts[j], it.correct)); });
        } else {
          $('#stage').innerHTML = `<div style="${padStyle('iq')}">${bar}<p class="q" style="font-size:17px">Найди лишнюю картинку</p>
            <div class="shopts">${it.items.map((s, j) => `<button class="shopt"><i class="shnum">${j+1}</i><span class="shfig">${iqSVG(s)}</span></button>`).join('')}</div>
            <button class="exbtn" id="exit">Завершить</button></div>`;
          wireExit(g);
          document.querySelectorAll('.shopt').forEach((b,j) => b.onclick = () => { if (g===gen) answer(b, j === it.oddIdx); });
        }
      };
      ask();
    };
    ageScreen();
  }
};

  .then(d => { $('#badge').textContent = d.ok ? '✓ Аккаунт Telegram подтверждён' : ''; })
